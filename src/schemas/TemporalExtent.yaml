---
id: https://w3id.org/isample/schema/temporalExtent/1.0
name: materialSampleTemporalExtent
title: Schema for documenting temporal extents related to a material sample 
description: |
  SMR 2025-06-06 copy text from github temporalExtent branch /temporalExtent/notes/temporalExtentProposal.md. This extension can be added by reference to the iSamples JSON schema 
  
license: https://creativecommons.org/publicdomain/zero/1.0/
version: "20250606"
prefixes:
  linkml: https://w3id.org/linkml/
  isam2: https://w3id.org/isample/schema/2.0/
  dct: http://purl.org/dc/terms/
  skos: http://www.w3.org/2004/02/skos/core#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  xsd: http://www.w3.org/2001/XMLSchema#
  sdo: http://schema.org/
  skos_concept: http://www.w3.org/2004/02/skos/core#Concept
  datacite: http://datacite.org/schema/kernel-4/
  temx: https://w3id.org/isample/schema/temporalExtent/1.0/
default_prefix: temx

imports:
  - linkml:types
  
classes:
  MaterialSampleRecord:
    slots:
      - temporal_extent
  TimePosition:
    description: >
        Data object for declaration of a time position or interval that is significant for understanding the context of a material sample. Typically this is the time at which the sampled feature originated, was used, was alive or some other event in the history of the sample. Extents can be specified with calendar dates, numerical coordinates, or using named temporal eras.  Example numeric systems include years before present (with various interpretations of what 'present' means), C.E./B.C.E years, unix time, julian date.  Reference systems based on named eras include e.g. geological time scales, the dynasties of ancient Egypt, reigns of English kings, ceramic-style chronologies.
    slots:
      - pid
      - label
      - description
      - numeric_younger_bound
      - numeric_older_bound
      - numeric_reference_system
      - era_name_younger
      - era_name_older
      - era_reference_system
      - date_time
      - event
      - evidence
    IdentifiedConcept:
      slots:
        - label
        - pid
        - scheme_name
        - scheme_uri
  slots:
    temporal_extent:
      range: TimePosition
      multivalued: true
    numeric_younger_bound:
      description: >
        A numeric value that is the younger bounday position in a one-dimension temporal coordinate system for the specified extent.  Values are quantized at some level, e.g. to the year, thousand year, million year. The units are specified in the numeric reference system definition. When the younger and older bound are not distinct at the resolution of the value, use the same value.  The bounds should reflect the uncertainty limits on the values.
      range: decimal
      multivalued: false
    numeric_older_bound:
      description: >
        A numeric value that is the older bounday position in a one-dimension temporal coordinate system for the specified extent.  Values are quantized at some level, e.g. to the year, thousand year, million year. The units are specified in the numeric reference system definition. When the younger and older bound are not distinct at the resolution of the value, use the same value.  The bounds should reflect the uncertainty limits on the values.
      range: decimal
      multivalued: false
    numeric_reference_system:
      description: >
        IdentifiedConcept with at least one of label or URI specifying the temporal coordinate system, including origin, unit of measure, and positive direction.  For interoperability, recommend using 'years before present (https://vocabs.gsq.digital/v/vocab/def:trs/trs:BeforePresent) with units of yr (yrbp) or Ma (million years),  or CE (common era) with units of years, origin at 0 (??? birth of Christ???), negative values for BCE. Switch from yr to Ma at the boundary between the Holocene and Pleistocene at 11700 yrbp.
      range:IdentifiedConcept
      multivalued: false
    era_name_younger:
      description: >
        IdentifiedConcept with at least one of label or URI specifying the time ordinal era (TOE) that is younger bound of specified extent. TOE is a time interval defined by bounding events that do not necessarily have known temporal coordinates. Chronologic relationships between events (before, after..) might be known to allow determination of temporal topologic relationships ([Allen, 1984](http://dx.doi.org/10.1016/0004-3702%2884%2990008-0), [Allen and Ferguson, 1997](http://dx.doi.org/10.1007/978-0-585-28322-7_7) ) between the intervals. Examples: Jurassic, Paleolithic, Reign of Tutankhamun. 
      range: IdentifiedConcept
      multivalued: false
    era_name_older:
      description: >
        IdentifiedConcept with at least one of label or URI specifying the time ordinal era (TOE) that is older bound of specified extent. TOE is a time interval defined by bounding events that do not necessarily have known temporal coordinates. Chronologic relationships between events (before, after..) might be known to allow determination of temporal topologic relationships ([Allen, 1984](http://dx.doi.org/10.1016/0004-3702%2884%2990008-0), [Allen and Ferguson, 1997](http://dx.doi.org/10.1007/978-0-585-28322-7_7) ) between the intervals. Examples: Jurassic, Paleolithic, Reign of Tutankhamun. 
      range: IdentifiedConcept
      multivalued: false
    era_reference_system:
      description: >
        A set of time ordinal eras used to assign temporal positions (https://w3c.github.io/sdw/time/#time:TRS). Note that in the original W3C formulation, the boundaries of the eras were required to be date-time positions; the [Cox and Richard 2014](http://dx.doi.org/10.1007/s12145-014-0170-6) formulation for the geologic time scale generalizes this to allow other boundary definitions applicable in domains dealing with intervals that predate calendar time. For geologic time, recommend use of International Commission on Stratigraphy (ICS) chronostratigraphic chart,  https://github.com/i-c-stratigraphy/chart-data/blob/main/isc2020.ttl, unless there is specific data indicating use of a different chart version. RDF representation of older versions of the ICS chart (with URIs) are available at https://github.com/CGI-IUGS/timescale-data/tree/master/rdf/.
      range: string
      multivalued: false
    date_time:
      description: >
        This field is for extents that are within the scope of calendar dates and/or times that can be represented using the syntax defined by [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html) (see [Wikipedia page](https://en.wikipedia.org/wiki/ISO_8601) for a non-paywall description). This syntax allows representing individual dates with or without time (and time zone), as well as intervals (closed or open ended).
      any_of:
       - range: date
       - range: datetime
       - pattern: "^(?:[1]?[0-9]{3}|20[0-2][0-9])$"
       - pattern: "^(?:[1]?[0-9]{3}|20[0-2][0-9])-(?:0[1-9]|1[0-2])$"
    event:
      description: >
        Material samples (endurants) do not have an age; events have an age (temporal extent). We are interested in the events in the sample history that will assist in sample discovery and assessment using iSamples metadata.  The value here would ideally be an identifier from a scheme useful across domains; multiple values might be provided with different granularity, ranging from cross domain to research-group specific. Use of the IdentifiedConcept construct will allow inclusion of the identifier, label. and scheme name.
      range: IdentifiedConcept
    evidence:
      description: >
        Text description of the basis for assigning a temporal extent to event in the history of the sample, e.g. isotopic date results, biostratigraphy, association with other dated objects.
      range: string
      multivalued: false